aid: ubras
name: Ubras
description: >-
  Ubras is a Chinese direct-to-consumer intimate apparel brand best known for
  popularizing sizeless (one-size) wireless bras and skin-layer basics. It
  sells through its Chinese official site at www.ubras.cn and an international
  Shopify storefront at ubras.com. The international store publishes a
  genuinely agent-ready commerce surface: a Universal Commerce Protocol (UCP)
  merchant profile at /.well-known/ucp, live MCP endpoints for catalog search,
  cart, and buyer-approved checkout, llms.txt and agents.md agent
  instructions, and Shopify customer-accounts OIDC discovery. Ubras is a
  portfolio company of Hongshan (Sequoia Capital China).
