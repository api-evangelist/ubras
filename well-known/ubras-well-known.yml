method: searched
description: >-
  Results of probing the /.well-known/ and agent-discovery surface of Ubras's
  two web properties: ubras.com (international Shopify storefront) and
  www.ubras.cn (Chinese official site). Status is the HTTP code observed at
  fetch time. ubras.com is a Shopify store, so it publishes the Shopify
  customer-accounts OIDC discovery documents, a Universal Commerce Protocol
  (UCP) merchant profile, an llms.txt, and a canonical /agents.md agent guide.
  www.ubras.cn answers 302 (redirect to the homepage) for every discovery path,
  so nothing real is published there.
